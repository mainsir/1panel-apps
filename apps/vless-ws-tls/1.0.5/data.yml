additionalProperties:
  formFields:
    - default: ""
      edit: true
      envKey: PUBLIC_HOST
      labelZh: 客户端域名
      labelEn: Client domain
      description:
        zh: 填写已配置 HTTPS 证书的域名。
        en: Enter a domain with an HTTPS certificate configured.
      required: true
      type: text

    - default: 18443
      edit: true
      envKey: PANEL_APP_PORT_TCP
      labelZh: 本机端口（默认即可）
      labelEn: Local port (keep default)
      description:
        zh: 反向代理的目标端口，客户端使用 443。
        en: Target port for the reverse proxy. Clients use port 443.
      required: true
      rule: paramPort
      type: number

    - default: /cdn-cgi/assets/v7kQm2pLx9nR
      edit: true
      envKey: WS_PATH
      labelZh: WS 路径（默认即可）
      labelEn: WS path (keep default)
      description:
        zh: 需与反向代理的路径配置一致。
        en: Must match the path configured in the reverse proxy.
      required: true
      type: text

    - default: ""
      edit: true
      envKey: SOCKS5_HOST
      labelZh: SOCKS5 地址（可选）
      labelEn: SOCKS5 host (optional)
      required: false
      type: text

    - default: ""
      edit: true
      envKey: SOCKS5_PORT
      labelZh: SOCKS5 端口（可选）
      labelEn: SOCKS5 port (optional)
      required: false
      type: text

    - default: ""
      edit: true
      envKey: SOCKS5_USER
      labelZh: SOCKS5 账号（可选）
      labelEn: SOCKS5 username (optional)
      required: false
      type: text

    - default: ""
      edit: true
      envKey: SOCKS5_PASS
      labelZh: SOCKS5 密码（可选）
      labelEn: SOCKS5 password (optional)
      required: false
      type: password
