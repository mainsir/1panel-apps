services:
  kasmweb-chrome:
    image: kasmweb/chrome:1.16.0
    container_name: ${CONTAINER_NAME}
    restart: always
    shm_size: 1g
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTPS}:6901"
    environment:
      VNC_PW: ${VNC_PW}
      LAUNCH_URL: ${LAUNCH_URL}
      TZ: ${TZ}
    volumes:
      - ./data:/home/kasm-user
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
