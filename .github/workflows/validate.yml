name: Validate App Packages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Validate App Packages
        run: |
          python scripts/validate-apps.py

      - name: Check Shell Scripts Syntax
        run: |
          while IFS= read -r -d '' f; do
            echo "Checking syntax: $f"
            bash -n "$f"
          done < <(find apps scripts -name "*.sh" -print0)

      - name: Install Matching sing-box for Integration Tests
        run: |
          version=$(python - <<'PY'
          from pathlib import Path
          import yaml
          compose = max(Path('apps/vless-ws-tls').glob('*/docker-compose.yml'),
                        key=lambda path: tuple(map(int, path.parent.name.split('.'))))
          image = yaml.safe_load(compose.read_text())['services']['vless-ws-tls']['image']
          print(image.rsplit(':', 1)[1].removeprefix('v'))
          PY
          )
          mkdir -p "$RUNNER_TEMP/sing-box-tool"
          curl -fsSL --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v${version}/sing-box-${version}-linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/sing-box.tar.gz"
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP/sing-box-tool" \
            --strip-components=1 "sing-box-${version}-linux-amd64/sing-box"
          echo "$RUNNER_TEMP/sing-box-tool" >> "$GITHUB_PATH"

      - name: Check Configuration Regressions
        run: python -m unittest discover -s tests -v
